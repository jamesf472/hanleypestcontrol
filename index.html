<style>

:root{
    --gold:#D4AF37;
    --black:#000000;
    --dark:#111111;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#000;
    color:#fff;
    line-height:1.6;
}

header{
    text-align:center;
    padding:20px;
    background:#000;
}

.logo{
    max-width:900px;
    width:100%;
    height:auto;
}

nav{
    background:#111;
    padding:15px;
    text-align:center;
    position:sticky;
    top:0;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin:0 15px;
}

.hero{
    min-height:70vh;
    background:
    linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
    url('hero.png');
    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    padding:40px 20px;
}

.hero-content{
    max-width:800px;
}

.hero h1{
    color:var(--gold);
    font-size:3rem;
    margin-bottom:20px;
}

.hero p{
    margin-bottom:25px;
    font-size:1.2rem;
}

.btn{
    display:inline-block;
    padding:14px 28px;
    background:var(--gold);
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
    margin:5px;
}

.section{
    max-width:1200px;
    margin:auto;
    padding:70px 20px;
}

.section h2{
    text-align:center;
    color:var(--gold);
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:var(--dark);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:20px;
}

form{
    max-width:700px;
    margin:auto;
}

input,
textarea{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
}

.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:15px 20px;
    border-radius:40px;
    font-weight:bold;
}

.call{
    position:fixed;
    left:20px;
    bottom:20px;
    background:var(--gold);
    color:#000;
    text-decoration:none;
    padding:15px 20px;
    border-radius:40px;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid #222;
}

@media(max-width:768px){

.hero h1{
    font-size:2rem;
}

}

</style>

</head>
